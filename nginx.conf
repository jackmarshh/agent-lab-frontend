server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 支持 React Router 的 History 模式
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 K8s 里的后端服务
    # 假设后端的 Service 叫 agent-lab-service，端口是 8000
    location /api/ {
        # 重写路径，去掉 /api 前缀 (如果后端接口本身不带 /api 的话)
        # rewrite ^/api/(.*)$ /$1 break;
        
        # 在 K8s 内部，可以通过服务名直接访问
        proxy_pass http://agent-lab-service.default.svc.cluster.local:8000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}