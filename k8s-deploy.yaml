apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-lab-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-lab-frontend
  template:
    metadata:
      labels:
        app: agent-lab-frontend
    spec:
      containers:
      - name: frontend
        image: jackmars/agent-lab-frontend:v3
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: agent-lab-frontend-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082  # 前端访问端口
  selector:
    app: agent-lab-frontend